notes:
- Hand-corrected Windows table. align picked 0x00ab0dc8, which is cSC4CrimeSimulator's primary (offset 0) table, matched only
  because cSC4WealthRequester has the interface at offset 0. The real interface tables are the offset-8 subtables 0x00ab2600
  (cSC4PollutionSimulator, QI 0x006e2cd0, used here to match the Mac primary implementer) and 0x00ab0d9c (cSC4CrimeSimulator,
  QI 0x0069f1b0).
- 'Both subtables are 7 slots: the next 4 entries are adjacent cIGZMessageTarget2 (offset 4) tables (QI thunks SUB ECX,4),
  so no slot was added after the Mac build. Machine fields below were set by hand, re-running align would undo them.'
- cSC4WealthRequester's Windows QI was not found by the export.
